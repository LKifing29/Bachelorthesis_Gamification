<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Vitae</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <main class="form-container">
        <header class="welcome-container">
            <h1>Curriculum Vitae</h1>
        </header>

        <form autocomplete="off" method="post" action="/process_cv">
            <table id="cvTable">
                <thead>
                    <tr>
                        <th>From</th>
                        <th>To</th>
                        <th>Location</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody>
                    {% if session.get('resume') %}
                        {% for entry in session.get('resume', []) %}
                        <tr>
                            <td><input type="text" name="from_date[]" value="{{ entry.from_date }}" size="10"></td>
                            <td><input type="text" name="to_date[]" value="{{ entry.to_date }}" size="10"></td>
                            <td><input type="text" name="location[]" value="{{ entry.location }}"></td>
                            <td><input type="text" name="description[]" value="{{ entry.description }}" size="40"></td>
                        </tr>
                        {% endfor %}
                    {% else %}
                        <tr>
                            <td><input type="text" name="from_date[]" size="10"></td>
                            <td><input type="text" name="to_date[]" size="10"></td>
                            <td><input type="text" name="location[]"></td>
                            <td><input type="text" name="description[]" size="40"></td>
                        </tr>
                    {% endif %}
                </tbody>
            </table>

            <div class="button-container">
                <button type="submit" class="button next-button">Next</button>
                <button type="button" id="addRow" class="button setting-button">Add Row</button>
                <button type="button" onclick="window.location.href='{{ url_for('character') }}'" class="button back-button">Back</button>
            </div>
        </form>
    </main>

    <script>
        document.getElementById('addRow').addEventListener('click', function() {
            const tbody = document.querySelector('#cvTable tbody');
            const row = tbody.insertRow();
            row.innerHTML = `
                <td><input type="text" name="from_date[]" size="10"></td>
                <td><input type="text" name="to_date[]" size="10"></td>
                <td><input type="text" name="location[]"></td>
                <td><input type="text" name="description[]" size="40"></td>
            `;
        });
    </script>
</body>
</html>
